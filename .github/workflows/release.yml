name: Release

on:
  release:
    types: [published]
  
jobs:
  build:
    runs-on: windows-latest
    
    defaults:
      run:
        working-directory: ${{ github.workspace }}/
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0
          
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v1
        
      - name: Install NSIS
        uses: negrutiu/nsis-install@v2
        
      - name: Install dependencies
        run: dotnet restore
        
      - name: Test with .NET
        run: dotnet test
        
      - name: Extract version from tag
        shell: bash
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION.0" >> $GITHUB_ENV
          
      - name: Publish
        run: > 
          msbuild.exe /target:publish
          /p:PublishProfile=FolderProfile.pubxml
          /p:ApplicationVersion=${{ env.VERSION }}
          /p:AssemblyVersion=${{ env.VERSION }}
          
      - name: Build installer
        run: makensis ./setup/soundshell_setup.nsi
        
      - name: Upload setup file to GitHub Release
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ github.event.release.upload_url }}
          asset_path: ./setup/sound_shell_windows_setup.exe
          asset_name: sound_shell_windows_setup.exe
          asset_content_type: application/exe
